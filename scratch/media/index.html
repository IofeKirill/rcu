<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src {{source}} 'nonce-{{nonce}}'; style-src {{source}} 'unsafe-inline'; img-src {{source}} data:; font-src {{source}} data:;"><link rel="stylesheet" href="{{base}}/style.css"><title>ZMROBO · Блоки</title></head><body class="dark python-hidden">
<header><b class="brand">ZMROBO</b><div class="fileMenu"><button id="fileMenuButton">Файл ▾</button><div id="fileMenu" hidden><button id="new">Новый проект</button><button id="open">Открыть…</button><button id="save">Сохранить</button><button id="saveAs">Сохранить как…</button><hr><button id="export">Экспорт Python…</button><button id="python">Открыть Python в редакторе</button></div></div><label class="controllerLabel">Контроллер <select id="controller"><option>E6</option><option>M6</option><option>E7</option></select></label><span class="headerSpace"></span><button id="connectionButton" title="Подключение к роботу"><span class="connectionDot" aria-hidden="true"></span><span id="connectionLabel">Подключить</span></button><button id="toggleTheme" title="Переключить тему">Светлая тема</button><button id="toggleCode" class="codeToggle" aria-pressed="false">Python</button></header>
<div class="runbar"><button id="simulate" class="run" title="Открыть симулятор и передать программу без запуска">Симулятор</button><span class="divider"></span><button id="upload" title="Загрузить текущие блоки на выбранный контроллер · F6">Загрузить на робота</button><button id="play" class="run" title="Запустить на роботе через USB COM или Bluetooth">▶</button><button id="stop" class="stop" title="Остановить">■</button><span id="projectName">Программа из блоков</span></div>
<main><div id="workspace" aria-label="Редактор RoboCode"><div id="categoryResize" class="paneResize innerResize" role="separator" tabindex="0" aria-label="Ширина списка категорий" aria-orientation="vertical"></div><div id="paletteResize" class="paneResize innerResize" role="separator" tabindex="0" aria-label="Ширина палитры блоков" aria-orientation="vertical"></div><button id="toggleMap" title="Обзор всего проекта" aria-label="Обзор всего проекта" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19 9 7l5 12zm9 0 4-9 5 9" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17" cy="5" r="1.8" fill="currentColor"/></svg></button><div id="projectMap" hidden><div class="mapHeading">Обзор проекта<button id="closeMap" aria-label="Закрыть обзор">×</button></div><svg id="mapSvg" xmlns="http://www.w3.org/2000/svg" aria-label="Карта проекта: нажми для перехода" role="img"></svg></div></div><div id="codeResize" hidden class="paneResize" role="separator" tabindex="0" aria-label="Ширина Python" aria-orientation="vertical"></div><aside id="codePane" hidden><div class="paneTitle">Python<button id="closeCode" title="Свернуть Python" aria-label="Свернуть Python">×</button></div><pre id="code"></pre><div id="compatibility"></div></aside></main><footer><span id="status" role="status">Загрузка…</span><span>Ctrl+S — сохранить · F6 — загрузить</span></footer>
<dialog id="prompt"><form method="dialog"><label id="promptLabel" for="promptValue"></label><input id="promptValue" autocomplete="off"><div><button value="cancel" formnovalidate>Отмена</button><button value="ok" class="primary">OK</button></div></form></dialog>
<dialog id="connectionDialog" aria-labelledby="connectionTitle"><div class="connectionHeading"><h2 id="connectionTitle">Подключение к роботу</h2><button id="closeConnection" aria-label="Закрыть подключение">×</button></div><p id="connectionState"></p><div class="connectionChoices"><button id="connectUSB"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M18 5h12v13H18zM14 18h20v13H14zM24 31v12" fill="none" stroke="currentColor" stroke-width="3"/></svg><span>USB</span></button><button id="connectBluetooth"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4v40l12-12-24-16m0 16L36 16 24 4" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg><span>Bluetooth</span></button></div><button id="disconnectRobot" hidden>Отключить робота</button></dialog>
<dialog id="procedureDialog"><form method="dialog"><h2>Создать блок</h2><label>Имя блока<input id="procedureName" value="MyFunction" autocomplete="off"></label><label>Параметры через запятую<input id="procedureArgs" placeholder="speed, angle" autocomplete="off"></label><label class="checkLabel"><input type="checkbox" id="procedureReturns"> Возвращает значение</label><p id="procedureError"></p><div><button id="procedureCancel" type="button">Отмена</button><button id="procedureCreate" type="button" class="primary">Создать</button></div></form></dialog>
<script nonce="{{nonce}}" src="{{base}}/vendor/blockly_compressed.js"></script><script nonce="{{nonce}}" src="{{base}}/vendor/blocks_compressed.js"></script><script nonce="{{nonce}}" src="{{base}}/vendor/ru.js"></script><script nonce="{{nonce}}">globalThis.LegacyBlockly=Blockly;</script><script nonce="{{nonce}}" src="{{base}}/legacy/v1-blocks.js"></script>
<script nonce="{{nonce}}" src="{{base}}/vendor/scratch-blocks.js"></script><script nonce="{{nonce}}" src="{{base}}/robocode-locale.js"></script><script nonce="{{nonce}}" src="{{base}}/catalog-data.js"></script><script nonce="{{nonce}}" src="{{base}}/core.js"></script><script nonce="{{nonce}}" src="{{base}}/reference-blocks.js"></script><script nonce="{{nonce}}" src="{{base}}/migrate-v1.js"></script><script nonce="{{nonce}}" src="{{base}}/layout.js"></script><script nonce="{{nonce}}" src="{{base}}/navigation.js"></script><script nonce="{{nonce}}" src="{{base}}/python-highlight.js"></script><script nonce="{{nonce}}" src="{{base}}/connections.js"></script><script nonce="{{nonce}}" src="{{base}}/app.js"></script></body></html>
